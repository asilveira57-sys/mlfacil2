<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Analyzer Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2a4a70 100%);
      color: #ffffff;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .status-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .status-icon.connected {
      background: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .status-icon.disconnected {
      background: #ef4444;
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
    }

    .info-label {
      opacity: 0.8;
    }

    .info-value {
      font-weight: 600;
    }

    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .button-primary {
      background: #ffffff;
      color: #1e3a5f;
    }

    .button-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
    }

    .button-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .button-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .button-danger {
      background: #ef4444;
      color: #ffffff;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      opacity: 0.7;
    }

    .footer a {
      color: #ffffff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📊</div>
    <h1>ML Analyzer Pro</h1>
    <p class="subtitle">Análise Profissional de Anúncios</p>
  </div>

  <div class="content" id="content">
    <div class="status">
      <div class="status-icon disconnected" id="status-icon"></div>
      <span class="status-text" id="status-text">Desconectado</span>
    </div>

    <div id="user-info" style="display: none;">
      <div class="info-item">
        <span class="info-label">Conta ML:</span>
        <span class="info-value" id="ml-account">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Anúncios Analisados:</span>
        <span class="info-value" id="analyzed-count">0</span>
      </div>
    </div>

    <div id="login-prompt">
      <p style="margin-bottom: 16px; font-size: 14px; line-height: 1.6;">
        Faça login para começar a analisar anúncios do Mercado Livre
      </p>
    </div>
  </div>

  <button class="button button-primary" id="login-button">
    Fazer Login
  </button>

  <button class="button button-secondary" id="dashboard-button" style="display: none;">
    Abrir Dashboard
  </button>

  <button class="button button-danger" id="logout-button" style="display: none;">
    Sair
  </button>

  <div class="footer">
    <p>v1.0.0 | <a href="#" id="help-link">Ajuda</a></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
